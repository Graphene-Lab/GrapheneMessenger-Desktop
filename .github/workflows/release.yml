# Auto-release: on every push to main we bump the patch version, build the
# installer for Windows, Linux and macOS, run the automatic tests, and publish
# a GitHub Release with all three installers.
#
# Installers are UNSIGNED (no code-signing certificate is configured). To sign
# them later, add the signing secrets and drop the unsigned overrides.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch from latest tag
        id: bump
        run: |
          base=$(node -p "require('./package.json').version" | sed 's/-.*$//')
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -n "$latest" ]; then
            cur=${latest#v}
            major=$(echo "$cur" | cut -d. -f1)
            minor=$(echo "$cur" | cut -d. -f2)
            patch=$(echo "$cur" | cut -d. -f3)
            patch=$((patch + 1))
          else
            major=$(echo "$base" | cut -d. -f1)
            minor=$(echo "$base" | cut -d. -f2)
            patch=$(echo "$base" | cut -d. -f3)
          fi
          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

  build:
    name: Build ${{ matrix.os }}
    needs: version
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
          - os: macos-26
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true
          apt-packages: ${{ matrix.target == 'linux' && 'xvfb libpulse0' || '' }}

      - name: Prepare build
        run: pnpm run prepare-beta-build

      - name: Generate
        run: pnpm run generate

      - name: Run node tests (linux needs xvfb)
        if: matrix.target == 'linux'
        run: xvfb-run --auto-servernum pnpm run test-node

      - name: Run node tests
        if: matrix.target != 'linux'
        run: pnpm run test-node

      - name: Create preload cache (linux needs xvfb)
        if: matrix.target == 'linux'
        run: xvfb-run --auto-servernum pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/${{ matrix.target }}

      - name: Create preload cache
        if: matrix.target != 'linux'
        run: pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/${{ matrix.target }}

      # Unsigned Windows: drop the certificate fields so the sign script skips.
      - name: Remove Windows certificate fields (unsigned)
        if: matrix.target == 'win'
        shell: cmd
        run: |
          copy package.json temp.json
          del package.json
          type temp.json | findstr /v certificateSubjectName | findstr /v certificateSha1 > package.json

      - name: Build installer (unsigned)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            touch noop.sh && chmod +x noop.sh
            SIGN_MACOS_SCRIPT=noop.sh DISABLE_INSPECT_FUSE=on \
              pnpm run build:release --publish=never -c.extraMetadata.version=${{ needs.version.outputs.version }}
          else
            DISABLE_INSPECT_FUSE=on \
              pnpm run build:release --publish=never -c.extraMetadata.version=${{ needs.version.outputs.version }}
          fi
        shell: bash

      - name: Run release tests (linux needs xvfb)
        if: matrix.target == 'linux'
        run: xvfb-run --auto-servernum pnpm run test-release
        env:
          NODE_ENV: production

      - name: Run release tests
        if: matrix.target != 'linux'
        run: pnpm run test-release
        env:
          NODE_ENV: production

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag
        run: |
          git config user.name "graphene-release-bot"
          git config user.email "bot@graphene.invalid"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.version }}" || true
          git push origin "${{ needs.version.outputs.tag }}" || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          # Create the release as a draft once (reuse if it already exists).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --title "GrapheneMessenger Desktop $VER" \
              --notes "GrapheneMessenger Desktop $VER

          Installers for Windows, Linux and macOS.

          > Note: these installers are currently unsigned."
          fi
          # Upload each installer on its own, with retries. Large files (the macOS
          # .dmg) can hit transient "other side closed" connection errors.
          fail=0
          for f in dist/**/*.exe dist/**/*.dmg dist/**/*.zip dist/**/*.deb; do
            [ -f "$f" ] || continue
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1
                break
              fi
              echo "upload failed for $f (attempt $attempt), retrying in 15s..."
              sleep 15
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::could not upload $f after 5 attempts"
              fail=1
            fi
          done
          # Only publish (un-draft) when every installer uploaded successfully.
          if [ "$fail" -eq 0 ]; then
            gh release edit "$TAG" --draft=false
          fi
          exit "$fail"
